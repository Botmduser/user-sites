<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostNet | Cloud Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050505; color: #e2e8f0; overflow-x: hidden; }
        .glass { background: rgba(17, 18, 23, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .progress-bar { width: 0%; transition: width 0.5s ease; }
        .bottom-nav-active { color: #3b82f6; transform: translateY(-5px); transition: all 0.3s; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-3 md:p-6 pb-24 md:pb-6">

    <!-- TOP NAV -->
    <div class="flex justify-between items-center p-4 glass rounded-2xl mb-4">
        <h1 class="text-xl font-black italic text-blue-500">HOST<span class="text-white">NET</span></h1>
        <div id="status-tag" class="flex items-center gap-2 px-3 py-1 bg-green-500/10 rounded-full">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold text-green-500 uppercase">System Ready</span>
        </div>
    </div>

    <!-- LIVE STATS -->
    <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="glass p-4 rounded-2xl border-l-4 border-blue-500">
            <p class="text-[10px] text-gray-500 font-bold uppercase">Memory Usage</p>
            <div class="flex items-baseline gap-1">
                <span id="ram-val" class="text-2xl font-black italic">124</span>
                <span class="text-[10px] text-gray-400 font-bold">MB</span>
            </div>
            <div class="w-full bg-gray-800 h-1 mt-2 rounded-full overflow-hidden">
                <div id="ram-bar" class="bg-blue-500 h-full" style="width: 20%"></div>
            </div>
        </div>
        <div class="glass p-4 rounded-2xl border-l-4 border-purple-500">
            <p class="text-[10px] text-gray-500 font-bold uppercase">CPU Load</p>
            <div class="flex items-baseline gap-1">
                <span id="cpu-val" class="text-2xl font-black italic">2%</span>
            </div>
            <div class="w-full bg-gray-800 h-1 mt-2 rounded-full overflow-hidden">
                <div id="cpu-bar" class="bg-purple-500 h-full" style="width: 5%"></div>
            </div>
        </div>
    </div>

    <!-- TOKEN AREA -->
    <div class="glass p-4 rounded-2xl mb-4">
        <input type="password" id="apiToken" placeholder="Vercel API Token Here..." 
        class="w-full bg-black/40 border border-gray-800 rounded-xl py-3 px-4 text-xs outline-none focus:border-blue-500 text-blue-400">
    </div>

    <!-- EDITOR -->
    <div class="flex-1 glass rounded-3xl flex flex-col overflow-hidden mb-4 min-h-[300px]">
        <div class="p-3 bg-white/5 border-b border-white/5 flex justify-between items-center">
            <span class="text-[10px] font-bold text-gray-400 uppercase">index.html</span>
            <div id="deploy-loader" class="hidden text-blue-500 text-[10px] font-bold animate-bounce">DEPLOYING...</div>
        </div>
        <textarea id="editor" class="flex-1 bg-transparent p-4 font-mono text-xs md:text-sm outline-none resize-none text-gray-400" spellcheck="false"></textarea>
    </div>

    <!-- TERMINAL -->
    <div id="terminal" class="h-40 glass rounded-2xl p-4 font-mono text-[10px] overflow-y-auto space-y-1 bg-black/60 border border-blue-500/20">
        <p class="text-blue-500 font-bold">-- HostNet OS v4.0 --</p>
        <p class="text-gray-600">Waiting for user interaction...</p>
    </div>

    <!-- MOBILE NAV -->
    <div class="fixed bottom-4 left-4 right-4 h-16 glass rounded-2xl flex justify-around items-center px-4 md:hidden z-50">
        <button onclick="showSection('Dashboard')" class="bottom-nav-active"><i class="fas fa-home"></i></button>
        <button onclick="showSection('Nodes')" class="text-gray-500"><i class="fas fa-server"></i></button>
        <div onclick="startDeployment()" class="w-14 h-14 bg-blue-600 rounded-full -mt-10 flex items-center justify-center shadow-lg shadow-blue-600/40 border-4 border-[#050505] active:scale-90 transition">
            <i class="fas fa-rocket text-white"></i>
        </div>
        <button onclick="showSection('Security')" class="text-gray-500"><i class="fas fa-shield-alt"></i></button>
        <button onclick="showSection('Settings')" class="text-gray-500"><i class="fas fa-cog"></i></button>
    </div>

    <script>
        const editor = document.getElementById('editor');
        editor.value = `<!DOCTYPE html>\n<html>\n<body style="background:#000; color:#3b82f6; text-align:center; padding-top:100px;">\n  <h1>HostNet Edge Live</h1>\n  <p>Status: Active</p>\n</body>\n</html>`;

        function log(msg, type='info') {
            const term = document.getElementById('terminal');
            const colors = { info: 'text-gray-500', success: 'text-green-500', error: 'text-red-500', warn: 'text-yellow-500' };
            term.innerHTML += `<p class="${colors[type]}">> ${msg}</p>`;
            term.scrollTop = term.scrollHeight;
        }

        function showSection(name) {
            log(`Navigating to ${name}...`, 'warn');
        }

        async function startDeployment() {
            const token = document.getElementById('apiToken').value;
            if(!token) {
                log("ERROR: AUTH TOKEN NOT FOUND", 'error');
                return;
            }

            document.getElementById('deploy-loader').classList.remove('hidden');
            log("INITIATING DEPLOYMENT SEQUENCE", 'info');

            // 1 MINUTE SIMULATION START
            let progress = 0;
            const interval = setInterval(() => {
                progress += 1;
                
                // RAM/CPU Spike Simulation
                const ram = Math.floor(Math.random() * 200) + 400; // Increase to 400MB-600MB
                const cpu = Math.floor(Math.random() * 40) + 50;  // Increase to 50%-90%
                
                document.getElementById('ram-val').innerText = ram;
                document.getElementById('cpu-val').innerText = cpu + '%';
                document.getElementById('ram-bar').style.width = (ram/10) + '%';
                document.getElementById('cpu-bar').style.width = cpu + '%';

                if(progress === 10) log("CONNECTING TO VERCEL EDGE...", 'info');
                if(progress === 30) log("UPLOADING SOURCE FILES...", 'info');
                if(progress === 60) log("BUILDING PROJECT OPTIMIZATIONS...", 'warn');
                if(progress === 85) log("FINALIZING INSTANCE...", 'info');

                if(progress >= 100) {
                    clearInterval(interval);
                    completeDeployment(token);
                }
            }, 300); // 100 steps * 300ms = ~30 seconds (විනාඩියක් වැඩියි වගේ හින්දා තත්පර 30කට හැදුවා)
        }

        async function completeDeployment(token) {
            try {
                const res = await fetch('https://api.vercel.com/v13/deployments', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'hostnet-pro',
                        files: [{ file: 'index.html', data: editor.value }],
                        projectSettings: { framework: null }
                    })
                });
                const data = await res.json();
                
                // Reset Stats after deployment
                document.getElementById('ram-val').innerText = "124";
                document.getElementById('cpu-val').innerText = "3%";
                document.getElementById('ram-bar').style.width = "20%";
                document.getElementById('cpu-bar').style.width = "5%";
                document.getElementById('deploy-loader').classList.add('hidden');

                if(data.url) {
                    log(`DEPLOYMENT SUCCESSFUL! URL: ${data.url}`, 'success');
                    window.open(`https://${data.url}`, '_blank');
                } else {
                    log("VERCEL ERROR: " + data.error.message, 'error');
                }
            } catch (e) {
                log("SYSTEM CRASH: " + e.message, 'error');
            }
        }
    </script>
</body>
</html>
