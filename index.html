<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA | Premium Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono&display=swap');

        :root {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --bg: #020203;
            --surface: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% -20%, #1e293b 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #0f172a 0%, transparent 30%);
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        /* High-End Border Animation */
        .premium-card {
            position: relative;
            background: rgba(10, 10, 15, 0.8);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .premium-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(59,130,246,0.4), transparent, rgba(168,85,247,0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Glass Buttons */
        .glass-btn {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--accent-glow);
        }

        .active-nav {
            background: var(--accent) !important;
            color: white !important;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* View Switching Logic */
        .view-section {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(0.98) translateY(10px);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .view-section.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Animation for Stat Bars */
        .progress-fill {
            transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .nav-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 400px;
            height: 72px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="fixed top-0 left-0 w-full p-6 flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-900/50">
                <i class="fas fa-atom text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight leading-none text-white">AURA<span class="text-blue-500 font-light">CLOUD</span></h1>
                <span class="text-[9px] uppercase tracking-[0.2em] text-gray-500 font-bold">Quantum Engine v4</span>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></div>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="relative h-full pt-20 pb-28">

        <!-- DASHBOARD VIEW -->
        <section id="view-dash" class="view-section active">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="premium-card p-5">
                    <div class="flex justify-between items-start mb-2">
                        <i class="fas fa-microchip text-blue-500 text-xs"></i>
                        <span class="text-[10px] text-gray-500 font-bold uppercase">CPU</span>
                    </div>
                    <h3 id="cpu-text" class="text-2xl font-bold tracking-tighter">0.0%</h3>
                    <div class="w-full h-1 bg-white/5 rounded-full mt-3 overflow-hidden">
                        <div id="cpu-bar" class="progress-fill h-full bg-blue-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="premium-card p-5">
                    <div class="flex justify-between items-start mb-2">
                        <i class="fas fa-memory text-purple-500 text-xs"></i>
                        <span class="text-[10px] text-gray-500 font-bold uppercase">RAM</span>
                    </div>
                    <h3 id="ram-text" class="text-2xl font-bold tracking-tighter">0 MB</h3>
                    <div class="w-full h-1 bg-white/5 rounded-full mt-3 overflow-hidden">
                        <div id="ram-bar" class="progress-fill h-full bg-purple-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="flex-1 premium-card flex flex-col">
                <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center bg-white/[0.02]">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">main.js</span>
                    </div>
                    <button class="text-[10px] text-blue-500 font-bold hover:text-white transition">AUTO-SAVE</button>
                </div>
                <textarea id="editor" class="flex-1 p-6 bg-transparent outline-none resize-none text-sm font-mono text-gray-400 leading-relaxed" spellcheck="false">/**
 * AURA Cloud Instance
 * Build: v4.0.12
 */

async function initialize() {
    console.log("System Online...");
}</textarea>
            </div>
        </section>

        <!-- TERMINAL VIEW -->
        <section id="view-term" class="view-section">
            <div class="flex-1 premium-card bg-black/40 flex flex-col">
                <div id="term-body" class="flex-1 p-6 font-mono text-[12px] overflow-y-auto space-y-2">
                    <p class="text-blue-500 font-bold tracking-tighter mb-4">-- AURA QUANTUM SHELL v4.0 --</p>
                    <p class="text-gray-500">Type 'help' to see available commands.</p>
                </div>
                <div class="p-4 border-t border-white/5 flex gap-3 items-center">
                    <span class="text-blue-500 font-black ml-2">❯</span>
                    <input type="text" id="term-input" class="flex-1 bg-transparent border-none outline-none text-sm text-white" placeholder="Execute command...">
                </div>
            </div>
        </section>

        <!-- SETTINGS VIEW -->
        <section id="view-set" class="view-section">
            <div class="premium-card p-8 flex flex-col gap-6">
                <h2 class="text-xl font-bold tracking-tight italic">CONFIGURATION</h2>
                
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Authorization Key</label>
                        <input type="password" id="authKey" class="w-full glass-btn rounded-2xl py-4 px-6 text-sm outline-none text-blue-400" placeholder="••••••••••••••••">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass-btn p-4 rounded-2xl text-center">
                            <p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Region</p>
                            <p class="text-xs font-bold">Global-Edge</p>
                        </div>
                        <div class="glass-btn p-4 rounded-2xl text-center border-blue-500/30">
                            <p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Node</p>
                            <p class="text-xs font-bold text-blue-500">v20.x LTS</p>
                        </div>
                    </div>
                </div>

                <button onclick="switchView('dash', this)" class="mt-4 w-full py-4 bg-blue-600 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-blue-900/40 active:scale-95 transition-all">Save Environment</button>
            </div>
        </section>

    </main>

    <!-- NAVIGATION BAR -->
    <nav class="nav-bar premium-card">
        <button onclick="switchView('dash', this)" class="nav-item flex flex-col items-center gap-1 active-nav w-12 h-12 justify-center rounded-2xl transition-all">
            <i class="fas fa-home-alt text-lg"></i>
        </button>
        <button onclick="switchView('term', this)" class="nav-item flex flex-col items-center gap-1 w-12 h-12 justify-center rounded-2xl transition-all text-gray-500">
            <i class="fas fa-terminal text-lg"></i>
        </button>
        
        <div onclick="startDeployment()" class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-[20px] flex items-center justify-center shadow-2xl shadow-blue-500/40 -mt-10 border-[5px] border-[#020203] active:scale-90 transition-all cursor-pointer group">
            <i class="fas fa-bolt text-white text-xl group-hover:animate-pulse"></i>
        </div>
        
        <button onclick="switchView('set', this)" class="nav-item flex flex-col items-center gap-1 w-12 h-12 justify-center rounded-2xl transition-all text-gray-500">
            <i class="fas fa-gear text-lg"></i>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 w-12 h-12 justify-center rounded-2xl transition-all text-gray-500">
            <i class="fas fa-shield-heart text-lg"></i>
        </button>
    </nav>

    <!-- DEPLOY MODAL -->
    <div id="deployModal" class="hidden fixed inset-0 z-[2000] bg-black/90 backdrop-blur-2xl flex items-center justify-center p-8">
        <div class="w-full max-w-sm text-center">
            <div id="loader-icon" class="w-20 h-20 bg-blue-600/10 border border-blue-500/20 rounded-[30px] mx-auto flex items-center justify-center text-blue-500 text-3xl mb-8 relative">
                <i class="fas fa-rocket"></i>
                <div class="absolute inset-0 rounded-[30px] border-2 border-blue-500 border-t-transparent animate-spin"></div>
            </div>
            <h2 class="text-xl font-bold tracking-tight mb-2">INITIALIZING DEPLOY</h2>
            <p id="deploy-msg" class="text-[10px] text-gray-500 uppercase tracking-widest mb-10 font-mono">Allocating virtual core...</p>
            
            <div class="w-full h-[2px] bg-white/5 rounded-full overflow-hidden mb-10">
                <div id="deploy-progress" class="h-full bg-blue-500 shadow-[0_0_15px_#3b82f6]" style="width: 0%"></div>
            </div>

            <button onclick="closeDeploy()" class="text-[10px] font-bold text-gray-600 uppercase tracking-widest hover:text-white transition">Abort Operation</button>
        </div>
    </div>

    <script>
        // VIEW CONTROLLER
        function switchView(viewId, btn) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active-nav', 'text-white'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.add('text-gray-500'));
            
            if(btn) {
                btn.classList.add('active-nav', 'text-white');
                btn.classList.remove('text-gray-500');
            }
        }

        // REAL-TIME ANALYTICS SIMULATION
        function updateStats() {
            const cpu = (Math.random() * 4 + 1).toFixed(1);
            const ram = Math.floor(Math.random() * 20 + 128);
            
            document.getElementById('cpu-text').innerText = cpu + "%";
            document.getElementById('cpu-bar').style.width = (cpu * 10) + "%";
            
            document.getElementById('ram-text').innerText = ram + " MB";
            document.getElementById('ram-bar').style.width = (ram / 5) + "%";
        }
        setInterval(updateStats, 3000);
        updateStats();

        // PREMIUM DEPLOYMENT SEQUENCE
        function startDeployment() {
            const key = document.getElementById('authKey').value;
            if(!key) {
                alert("CRITICAL: Authentication Key Missing");
                switchView('set', document.querySelector('.fa-gear').parentElement);
                return;
            }

            const modal = document.getElementById('deployModal');
            const bar = document.getElementById('deploy-progress');
            const msg = document.getElementById('deploy-msg');
            
            modal.classList.remove('hidden');
            let progress = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 12;
                if(progress > 100) progress = 100;
                bar.style.width = progress + "%";
                
                if(progress > 20) msg.innerText = "Encrypting Source Code...";
                if(progress > 50) msg.innerText = "Spawning Docker Instance...";
                if(progress > 80) msg.innerText = "Finalizing Handshake...";
                
                if(progress === 100) {
                    clearInterval(interval);
                    msg.innerText = "INSTANCE DEPLOYED SUCCESSFULLY";
                    msg.style.color = "#22c55e";
                    document.getElementById('loader-icon').innerHTML = '<i class="fas fa-check"></i>';
                    document.getElementById('loader-icon').classList.replace('text-blue-500', 'text-green-500');
                    setTimeout(closeDeploy, 2500);
                }
            }, 400);
        }

        function closeDeploy() {
            document.getElementById('deployModal').classList.add('hidden');
            // Reset for next time
            document.getElementById('deploy-progress').style.width = "0%";
            document.getElementById('deploy-msg').innerText = "Allocating virtual core...";
            document.getElementById('deploy-msg').style.color = "";
            document.getElementById('loader-icon').innerHTML = '<i class="fas fa-rocket"></i>';
        }

        // TERMINAL COMMAND HANDLING
        document.getElementById('term-input').addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                const val = this.value.toLowerCase();
                const body = document.getElementById('term-body');
                body.innerHTML += `<div class="flex gap-2"><span class="text-blue-500">❯</span><span class="text-white">${this.value}</span></div>`;
                
                if(val === 'help') {
                    body.innerHTML += `<p class="text-gray-500 ml-4">Available: status, logs, clear, neofetch</p>`;
                } else if(val === 'status') {
                    body.innerHTML += `<p class="text-green-500 ml-4 italic">● All systems operational. Latency: 12ms</p>`;
                } else if(val === 'clear') {
                    body.innerHTML = '';
                } else if(val === 'neofetch') {
                    body.innerHTML += `<pre class="text-blue-400 text-[10px]">
   OS: AuraOS v4.0
   Kernel: 5.15.0-quantum
   Uptime: 24 days
   Shell: aura-sh 1.2
   CPU: Virtual Xeon (2) @ 2.4GHz
   RAM: 128MB / 512MB</pre>`;
                } else {
                    body.innerHTML += `<p class="text-red-500/50 ml-4">Command not recognized: ${val}</p>`;
                }
                this.value = '';
                body.scrollTop = body.scrollHeight;
            }
        });
    </script>
</body>
</html>
