<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLADE PRO | Mobile UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');

        :root { --neon: #00f2ff; --bg: #000000; --card: #0a0a0a; --border: #1a1a1a; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow: hidden;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-cols: 1fr 1fr;
            gap: 10px;
            padding: 0 16px 16px 16px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
        }

        /* Main View */
        .view-container {
            flex: 1;
            padding: 0 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-card {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            margin-bottom: 80px; /* Space for bottom nav */
        }

        #editor {
            font-family: 'JetBrains Mono', monospace;
            background: transparent;
            color: #00f2ff;
            border: none;
            resize: none;
            width: 100%;
            height: 100%;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Bottom Fixed Menu */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 10px 5px calc(10px + env(safe-area-inset-bottom)) 5px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #555;
            transition: 0.2s;
        }

        .nav-item.active { color: var(--neon); }
        .nav-item svg { width: 20px; height: 20px; stroke-width: 2.5; }
        .nav-item span { font-[900] text-[9px] uppercase tracking-tighter; }

        /* Other Views (Hidden by default) */
        .sub-view {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 50;
            padding: 20px;
            padding-top: 80px;
            display: none;
        }
        .sub-view.active { display: block; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="h-16 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-1.5 h-6 bg-[#00f2ff] rounded-full shadow-[0_0_10px_#00f2ff]"></div>
            <span class="font-black text-xl tracking-tighter uppercase italic">Blade<span class="text-gray-700">S</span></span>
        </div>
        <div class="flex items-center gap-1.5 bg-green-500/10 px-2 py-1 rounded-md border border-green-500/20">
            <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[9px] font-black text-green-500 uppercase">Live</span>
        </div>
    </header>

    <!-- Stats Row -->
    <div class="stats-grid">
        <div class="stat-card">
            <p class="text-[8px] font-black text-gray-600 uppercase mb-1">Compute</p>
            <p id="cpu" class="text-xl font-bold tracking-tighter text-white">4.2%</p>
        </div>
        <div class="stat-card">
            <p class="text-[8px] font-black text-gray-600 uppercase mb-1">Volatile</p>
            <p id="ram" class="text-xl font-bold tracking-tighter text-[#00f2ff]">124MB</p>
        </div>
    </div>

    <!-- Main View (Editor) -->
    <div class="view-container">
        <div class="editor-card" id="main-ui">
            <div class="flex justify-between items-center mb-3">
                <span class="text-[9px] font-bold text-gray-500 tracking-widest uppercase">worker.js</span>
                <button onclick="deployEffect()" class="text-[9px] font-black text-[#00f2ff] border border-[#00f2ff]/30 px-2 py-0.5 rounded">DEPLOY</button>
            </div>
            <textarea id="editor" spellcheck="false">const blade = require('core');

// System Ready...
blade.on('connect', () => {
    console.log('Secure Tunnel Open');
});</textarea>
        </div>
    </div>

    <!-- Sub Views -->
    <div id="view-shell" class="sub-view">
        <h2 class="text-2xl font-black mb-4">TERMINAL</h2>
        <div class="bg-black border border-white/5 rounded-xl p-4 font-mono text-xs text-gray-500 h-64 overflow-y-auto">
            <p class="text-[#00f2ff]">> Connection Established</p>
            <p>> Root access granted...</p>
        </div>
    </div>

    <div id="view-security" class="sub-view">
        <h2 class="text-2xl font-black mb-4">SECURITY</h2>
        <div class="stat-card mb-4 flex justify-between items-center">
            <span class="text-xs font-bold">WAF Firewall</span>
            <span class="text-green-500 font-black text-xs uppercase">Protected</span>
        </div>
        <div class="stat-card flex justify-between items-center">
            <span class="text-xs font-bold">SSL Certificate</span>
            <span class="text-[#00f2ff] font-black text-xs uppercase">Valid</span>
        </div>
    </div>

    <div id="view-config" class="sub-view">
        <h2 class="text-2xl font-black mb-4">SETTINGS</h2>
        <div class="space-y-4">
            <div class="stat-card">
                <p class="text-[9px] font-black text-gray-600 uppercase mb-2">API Secret</p>
                <input type="password" class="bg-black w-full text-sm p-2 outline-none border-b border-white/10" value="••••••••••••">
            </div>
        </div>
    </div>

    <!-- FIXED BOTTOM MENU (එළියට ගත්ත බටන් ටික) -->
    <nav class="bottom-nav">
        <div onclick="showTab('main', this)" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Core</span>
        </div>
        <div onclick="showTab('shell', this)" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span>Shell</span>
        </div>
        <div onclick="showTab('security', this)" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>Safe</span>
        </div>
        <div onclick="showTab('config', this)" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Conf</span>
        </div>
    </nav>

    <script>
        // Switch Between Views
        function showTab(id, el) {
            // Remove active from all
            document.querySelectorAll('.sub-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Set new active
            el.classList.add('active');
            if(id !== 'main') {
                document.getElementById('view-' + id).classList.add('active');
            }
        }

        // Stats Simulation
        setInterval(() => {
            document.getElementById('cpu').innerText = (Math.random() * 2 + 1).toFixed(1) + "%";
            document.getElementById('ram').innerText = (Math.floor(Math.random() * 10) + 122) + "MB";
        }, 2000);

        // Simple Deploy Effect
        function deployEffect() {
            const btn = event.target;
            btn.innerText = "PUSHING...";
            btn.style.color = "#fff";
            setTimeout(() => {
                btn.innerText = "SUCCESS";
                btn.style.color = "#22c55e";
                setTimeout(() => {
                    btn.innerText = "DEPLOY";
                    btn.style.color = "#00f2ff";
                }, 2000);
            }, 1500);
        }
    </script>
</body>
</html>
