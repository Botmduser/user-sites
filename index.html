<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLADE STEALTH | Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');

        :root { --neon: #00f2ff; --bg: #030303; --card: #0a0a0a; --border: #141414; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Views Logic */
        .view-container { flex: 1; position: relative; overflow: hidden; }
        .view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 16px;
            animation: view-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .view.active { display: flex; }
        @keyframes view-in { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; }

        /* Floating Command Trigger */
        .fab-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .fab-trigger {
            width: 60px;
            height: 60px;
            background: var(--neon);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 242, 255, 0.3);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fab-trigger.open { transform: rotate(135deg); background: #ffffff; }

        /* Menu Overlay */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            z-index: 900;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .menu-overlay.active { display: flex; }

        .menu-item {
            width: 85%;
            max-width: 280px;
            padding: 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; }
        .menu-item span { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

        header { border-bottom: 1px solid var(--border); shrink-0; }
        #editor { font-family: 'JetBrains Mono', monospace; background: transparent; color: #666; border: none; resize: none; width: 100%; height: 100%; font-size: 13px; }
    </style>
</head>
<body class="pt-[env(safe-area-inset-top)]">

    <header class="w-full h-16 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-2">
            <div class="w-1 h-6 bg-[#00f2ff] rounded-full"></div>
            <span class="font-black text-lg tracking-tighter uppercase italic">Blade<span class="text-[#333]">S</span></span>
        </div>
        <div class="px-2 py-1 border border-green-500/20 rounded-md">
            <span class="text-[8px] font-black text-green-500 uppercase">Online</span>
        </div>
    </header>

    <div class="view-container">
        
        <!-- DASHBOARD VIEW -->
        <div id="view-home" class="view active">
            <!-- Memory & CPU - Top Row -->
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="card">
                    <p class="text-[8px] font-black text-gray-500 uppercase mb-1">Compute Core</p>
                    <p id="cpu-val" class="text-xl font-bold tracking-tight">--%</p>
                </div>
                <div class="card">
                    <p class="text-[8px] font-black text-gray-500 uppercase mb-1">Volatile Mem</p>
                    <p id="ram-val" class="text-xl font-bold tracking-tight text-[#00f2ff]">--MB</p>
                </div>
            </div>
            
            <!-- Code Editor - Filling the Rest -->
            <div class="card flex-1 flex flex-col overflow-hidden">
                <div class="flex justify-between mb-2">
                    <span class="text-[8px] font-bold text-gray-700">APP.JS</span>
                    <span class="text-[8px] font-bold text-[#00f2ff]">READ-WRITE</span>
                </div>
                <textarea id="editor" spellcheck="false">const bot = require('blade');

bot.start({
    token: 'process.env.TOKEN',
    mode: 'stealth'
});</textarea>
            </div>
        </div>

        <!-- TERMINAL VIEW -->
        <div id="view-shell" class="view">
            <div class="card flex-1 bg-black flex flex-col">
                <div id="term-out" class="flex-1 p-2 font-mono text-[10px] overflow-y-auto text-gray-500">
                    <p class="text-[#00f2ff]">BladeStealth Terminal Active...</p>
                </div>
                <div class="p-3 border-t border-white/5 flex gap-2">
                    <span class="text-[#00f2ff] font-bold">❯</span>
                    <input type="text" id="shell-in" class="bg-transparent flex-1 text-xs outline-none" placeholder="Enter Command">
                </div>
            </div>
        </div>

        <!-- SECURITY VIEW -->
        <div id="view-security" class="view">
            <div class="card text-center py-10">
                <div class="w-16 h-16 bg-blue-500/10 rounded-3xl mx-auto flex items-center justify-center text-blue-500 mb-4">
                    <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h2 class="text-lg font-black uppercase mb-2">Shield Active</h2>
                <p class="text-[10px] text-gray-500 mb-6">DDoS Protection & SSL Tunneling Enabled.</p>
                <div class="space-y-3">
                    <div class="p-4 bg-white/5 rounded-xl border border-white/5 text-left flex justify-between items-center">
                        <span class="text-xs">Firewall Status</span>
                        <span class="text-green-500 text-[10px] font-bold">ON</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONFIG VIEW -->
        <div id="view-config" class="view">
            <div class="card space-y-4">
                <h2 class="text-xl font-black italic">SETTINGS</h2>
                <div class="space-y-2">
                    <label class="text-[9px] font-black text-gray-600 uppercase">Secret Key</label>
                    <input type="password" id="apiKey" class="w-full bg-black border border-white/10 p-4 rounded-xl text-xs" placeholder="Blade-xxxx-xxxx">
                </div>
                <button onclick="switchView('home')" class="w-full py-4 bg-white text-black font-black text-[10px] uppercase rounded-xl">Save Config</button>
            </div>
        </div>

    </div>

    <!-- FAB TRIGGER -->
    <div class="fab-container">
        <div class="fab-trigger" id="fabTrigger" onclick="toggleMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
    </div>

    <!-- MENU OVERLAY (All Buttons Restored) -->
    <div class="menu-overlay" id="menuOverlay">
        <div onclick="switchView('home')" class="menu-item">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Dashboard</span>
        </div>
        <div onclick="switchView('shell')" class="menu-item">
            <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span>Terminal</span>
        </div>
        <div onclick="switchView('security')" class="menu-item">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>Security</span>
        </div>
        <div onclick="switchView('config')" class="menu-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
        </div>
        <div onclick="startDeploy()" class="menu-item bg-[#00f2ff] text-black border-none mt-4">
            <svg viewBox="0 0 24 24" stroke="#000"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            <span style="font-weight: 900;">Deploy</span>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('fabTrigger').classList.toggle('open');
            document.getElementById('menuOverlay').classList.toggle('active');
        }

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            if(document.getElementById('menuOverlay').classList.contains('active')) toggleMenu();
        }

        setInterval(() => {
            document.getElementById('cpu-val').innerText = (Math.random() * 3 + 2).toFixed(1) + "%";
            document.getElementById('ram-val').innerText = (Math.floor(Math.random() * 5) + 126) + "MB";
        }, 2000);

        function startDeploy() {
            const key = document.getElementById('apiKey').value;
            if(!key) { alert("ERROR: KEY REQUIRED"); switchView('config'); return; }
            toggleMenu();
            const fab = document.getElementById('fabTrigger');
            fab.innerHTML = '<div class="w-6 h-6 border-2 border-black border-t-transparent rounded-full animate-spin"></div>';
            setTimeout(() => {
                fab.style.background = "#22c55e";
                fab.innerHTML = '<svg viewBox="0 0 24 24" stroke="#000" style="width:24px; height:24px;"><polyline points="20 6 9 17 4 12"/></svg>';
                setTimeout(() => {
                    fab.style.background = "";
                    fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
                }, 2000);
            }, 3000);
        }

        document.getElementById('shell-in').onkeydown = function(e) {
            if(e.key === 'Enter') {
                const out = document.getElementById('term-out');
                out.innerHTML += `<p><span class="text-[#00f2ff]">❯</span> ${this.value}</p>`;
                this.value = '';
                out.scrollTop = out.scrollHeight;
            }
        };
    </script>
</body>
</html>
