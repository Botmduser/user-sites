<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostNet | Ultra-Premium Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono&display=swap');
        
        body { font-family: 'Space Grotesk', sans-serif; background: #020203; color: #f8fafc; overflow: hidden; }
        .bg-glow { position: fixed; width: 300px; height: 300px; background: #3b82f6; filter: blur(150px); opacity: 0.15; z-index: -1; border-radius: 50%; }
        
        .glass-panel { background: rgba(15, 17, 26, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .neon-border { border-bottom: 2px solid transparent; background-image: linear-gradient(rgba(15,17,26,0), rgba(15,17,26,0)), linear-gradient(90deg, #3b82f6, #8b5cf6); background-origin: border-box; background-clip: content-box, border-box; }
        
        .stat-bar { transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal { transform: scale(0.9); opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal.active { transform: scale(1); opacity: 1; pointer-events: auto; }
        
        #editor { font-family: 'JetBrains Mono', monospace; scrollbar-width: none; }
        .glow-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .rocket-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 md:p-8">
    <div class="bg-glow top-0 left-0"></div>
    <div class="bg-glow bottom-0 right-0" style="background: #8b5cf6;"></div>

    <!-- HEADER -->
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 glass-panel rounded-2xl flex items-center justify-center text-blue-500 text-xl border border-blue-500/20 shadow-[0_0_20px_rgba(59,130,246,0.2)]">
                <i class="fas fa-microchip"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tighter uppercase italic">Host<span class="text-blue-500">Net</span></h1>
                <p class="text-[10px] text-gray-500 tracking-[0.2em] font-medium">NEXT-GEN DEPLOYMENT</p>
            </div>
        </div>
        <div id="status-chip" class="px-4 py-2 glass-panel rounded-full flex items-center gap-2 border border-green-500/20">
            <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]"></div>
            <span class="text-[10px] font-bold text-green-500 uppercase tracking-widest">Global Node Active</span>
        </div>
    </header>

    <!-- STATS -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="glass-panel p-5 rounded-[2rem] relative overflow-hidden">
            <div class="flex justify-between mb-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Memory</span>
                <span id="ram-val" class="text-xs font-bold text-blue-400">128 MB</span>
            </div>
            <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                <div id="ram-bar" class="stat-bar h-full bg-gradient-to-r from-blue-600 to-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.5)]" style="width: 15%"></div>
            </div>
        </div>
        <div class="glass-panel p-5 rounded-[2rem] relative overflow-hidden">
            <div class="flex justify-between mb-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Engine Load</span>
                <span id="cpu-val" class="text-xs font-bold text-purple-400">4%</span>
            </div>
            <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                <div id="cpu-bar" class="stat-bar h-full bg-gradient-to-r from-purple-600 to-purple-400 shadow-[0_0_15px_rgba(139,92,246,0.5)]" style="width: 4%"></div>
            </div>
        </div>
    </div>

    <!-- CODE EDITOR -->
    <div class="flex-1 glass-panel rounded-[2.5rem] flex flex-col overflow-hidden mb-6 border border-white/5">
        <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center bg-white/[0.02]">
            <div class="flex gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-red-500/20 border border-red-500/40"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/20 border border-yellow-500/40"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-green-500/20 border border-green-500/40"></div>
            </div>
            <span class="text-[10px] font-bold text-gray-500 tracking-widest uppercase">index.deploy.html</span>
        </div>
        <textarea id="editor" class="flex-1 bg-transparent p-8 outline-none resize-none text-gray-400 text-sm leading-relaxed" spellcheck="false"></textarea>
    </div>

    <!-- CONSOLE LOG -->
    <div class="h-32 glass-panel rounded-3xl p-5 mb-24 md:mb-0 border border-blue-500/10 overflow-y-auto font-mono text-[11px] space-y-2 bg-black/40">
        <div id="consoleOut" class="text-gray-500 italic">
            <p class="text-blue-500 font-bold mb-2">>> HostNet Kernel v5.0 Ready.</p>
        </div>
    </div>

    <!-- PREMIUM BOTTOM NAV -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] md:w-[400px] h-20 glass-panel rounded-[2.5rem] flex justify-around items-center px-4 z-50 border border-white/10 shadow-2xl">
        <button class="w-12 h-12 text-gray-500 hover:text-blue-500 transition-all active:scale-90"><i class="fas fa-th-large text-xl"></i></button>
        <button class="w-12 h-12 text-gray-500 hover:text-blue-500 transition-all active:scale-90"><i class="fas fa-terminal text-xl"></i></button>
        
        <button id="deployBtn" class="w-16 h-16 bg-gradient-to-br from-blue-600 to-purple-600 rounded-3xl -mt-12 flex items-center justify-center shadow-[0_15px_30px_rgba(59,130,246,0.4)] border-4 border-[#020203] active:scale-95 transition-all rocket-float">
            <i class="fas fa-terminal text-white text-2xl"></i>
        </button>
        
        <button onclick="toggleModal('securityModal')" class="w-12 h-12 text-gray-500 hover:text-blue-500 transition-all active:scale-90"><i class="fas fa-shield-halved text-xl"></i></button>
        <button onclick="toggleModal('settingsModal')" class="w-12 h-12 text-gray-500 hover:text-blue-500 transition-all active:scale-90"><i class="fas fa-sliders text-xl"></i></button>
    </div>

    <!-- MODAL: SETTINGS -->
    <div id="settingsModal" class="modal fixed inset-0 flex items-center justify-center z-[100] p-6 bg-black/60 backdrop-blur-md">
        <div class="glass-panel w-full max-w-md p-8 rounded-[3rem] border border-blue-500/20">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold italic uppercase">Configuration</h2>
                <button onclick="toggleModal('settingsModal')" class="text-gray-500"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-bold text-blue-400 uppercase tracking-widest block mb-3">Vercel Authentication</label>
                    <input type="password" id="apiToken" placeholder="Paste Private Token" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-5 text-sm outline-none focus:border-blue-500 transition-all">
                </div>
                <div class="p-4 bg-blue-500/5 rounded-2xl border border-blue-500/10">
                    <p class="text-xs text-gray-400 leading-relaxed italic">Environment: <span class="text-blue-400">Production</span><br>Region: <span class="text-blue-400">Global Edge</span></p>
                </div>
                <button onclick="toggleModal('settingsModal')" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-sm tracking-widest uppercase">Save Config</button>
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        editor.value = `<!DOCTYPE html>\n<html lang="en">\n<head>\n    <style>\n        body { background: #000; color: #3b82f6; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }\n        h1 { font-size: 3rem; text-shadow: 0 0 20px #3b82f6; }\n    </style>\n</head>\n<body>\n    <h1>INSTANCE LIVE</h1>\n</body>\n</html>`;

        function log(msg, color = "text-gray-500") {
            const out = document.getElementById('consoleOut');
            const p = document.createElement('p');
            p.className = `border-l-2 border-transparent pl-3 transition-all ${color}`;
            p.innerHTML = `<span class="opacity-20 mr-2">${new Date().toLocaleTimeString()}</span> ${msg}`;
            out.prepend(p);
            gsap.from(p, { x: -20, opacity: 0, duration: 0.5 });
        }

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('active');
        }

        async function startDeployment() {
            const token = document.getElementById('apiToken').value;
            if(!token) {
                log("!! AUTHENTICATION FAILED: TOKEN MISSING", "text-red-500 font-bold");
                toggleModal('settingsModal');
                return;
            }

            document.getElementById('deployBtn').classList.remove('rocket-float');
            log(">> INITIALIZING EDGE HANDSHAKE...", "text-blue-400 font-bold");

            // SLOW MEMORY CONSUMPTION ANIMATION
            let progress = 0;
            const step = () => {
                progress += 1;
                
                // Real-time curve simulation
                const ram = 128 + Math.pow(progress, 1.35); 
                const cpu = 4 + (progress * 0.8);

                if (progress <= 100) {
                    document.getElementById('ram-val').innerText = `${Math.floor(ram)} MB`;
                    document.getElementById('cpu-val').innerText = `${Math.floor(cpu)}%`;
                    document.getElementById('ram-bar').style.width = `${(ram/10)}%`;
                    document.getElementById('cpu-bar').style.width = `${cpu}%`;

                    if(progress === 20) log(">> SYNCING REPOSITORY DATA...", "text-gray-400");
                    if(progress === 50) log(">> COMPRESSING ASSETS...", "text-yellow-500");
                    if(progress === 80) log(">> GENERATING EDGE ROUTING...", "text-purple-400");

                    setTimeout(step, 100); // 10 seconds total
                } else {
                    completeDeployment(token);
                }
            };
            step();
        }

        async function completeDeployment(token) {
            try {
                const res = await fetch('https://api.vercel.com/v13/deployments', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'hostnet-premium',
                        files: [{ file: 'index.html', data: editor.value }],
                        projectSettings: { framework: null }
                    })
                });
                const data = await res.json();
                
                // Smooth Reset
                gsap.to(".stat-bar", { width: "10%", duration: 2 });
                document.getElementById('deployBtn').classList.add('rocket-float');

                if(data.url) {
                    log(">> DEPLOYMENT STABLE: " + data.url, "text-green-500 font-black glow-text");
                    setTimeout(() => window.open(`https://${data.url}`, '_blank'), 1000);
                } else {
                    log("!! VERCEL REJECTION: " + data.error.message, "text-red-400");
                }
            } catch (e) {
                log("!! CRITICAL ENGINE FAILURE", "text-red-600");
            }
        }

        document.getElementById('deployBtn').onclick = startDeployment;
    </script>
</body>
</html>
