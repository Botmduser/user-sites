<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLADE STEALTH | Pro Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');

        :root { --neon: #00f2ff; --bg: #030303; --card: #0a0a0a; --border: #141414; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        .view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 24px;
            padding-bottom: 100px;
            animation: view-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .view.active { display: flex; }
        @keyframes view-in { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }

        .fab-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .fab-trigger {
            width: 64px;
            height: 64px;
            background: var(--neon);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 30px rgba(0, 242, 255, 0.2);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .fab-trigger svg { stroke: #000; width: 28px; height: 28px; transition: 0.4s; }
        .fab-trigger.open { transform: rotate(135deg); background: #ffffff; box-shadow: 0 10px 20px rgba(255,255,255,0.1); }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            z-index: 900;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .menu-overlay.active { display: flex; animation: fade-in 0.3s ease; }

        .menu-item {
            width: 80%;
            max-width: 300px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }
        .menu-item:active { background: var(--neon); color: #000; transform: scale(0.95); }
        .menu-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .menu-item span { font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }

        #editor { font-family: 'JetBrains Mono', monospace; background: transparent; color: #555; border: none; resize: none; width: 100%; height: 100%; font-size: 14px; }
        
        header { background: rgba(3,3,3,0.7); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    </style>
</head>
<body class="pt-[env(safe-area-inset-top)]">

    <header class="fixed top-0 left-0 w-full h-20 flex items-center justify-between px-8 z-50">
        <div class="flex items-center gap-3">
            <div class="w-2 h-8 bg-[#00f2ff] rounded-full"></div>
            <span class="font-black text-xl tracking-tighter uppercase italic">Blade<span class="text-[#333]">S</span></span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-[9px] font-black uppercase text-gray-500">Node_Active</span>
        </div>
    </header>

    <div class="relative h-full w-full pt-20">
        
        <!-- DASHBOARD -->
        <div id="view-home" class="view active">
            <!-- Stats Moved Here: Under Header, Above Editor -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="card bg-gradient-to-br from-[#0a0a0a] to-[#050505]">
                    <p class="text-[9px] font-black text-gray-600 uppercase mb-2">Core Usage</p>
                    <p id="cpu-val" class="text-2xl font-bold tracking-tighter">--%</p>
                </div>
                <div class="card">
                    <p class="text-[9px] font-black text-gray-600 uppercase mb-2">Allocated</p>
                    <p id="ram-val" class="text-2xl font-bold tracking-tighter text-[#00f2ff]">--MB</p>
                </div>
            </div>
            
            <div class="card flex-1 flex flex-col">
                <textarea id="editor" spellcheck="false" placeholder="// Write code here...">const server = require('blade');

server.ignite({
    port: 3000,
    status: 'Ready'
});</textarea>
            </div>
        </div>

        <!-- TERMINAL -->
        <div id="view-shell" class="view">
            <div class="card flex-1 bg-black flex flex-col border-[#00f2ff]/10">
                <div id="term-out" class="flex-1 p-4 font-mono text-[11px] overflow-y-auto text-gray-500">
                    <p class="text-[#00f2ff] font-bold">BladeStealth OS v1.0.4</p>
                </div>
                <div class="p-4 border-t border-white/5 flex gap-2">
                    <span class="text-[#00f2ff] font-bold">❯</span>
                    <input type="text" id="shell-in" class="bg-transparent flex-1 text-xs" placeholder="Command...">
                </div>
            </div>
        </div>

        <!-- CONFIG -->
        <div id="view-config" class="view">
            <div class="space-y-6">
                <h2 class="text-3xl font-black italic">CONFIG</h2>
                <div class="card space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-600 uppercase">Master API Key</label>
                        <input type="password" id="apiKey" class="w-full bg-black/40 border border-white/5 p-5 rounded-2xl text-xs" placeholder="••••••••••••">
                    </div>
                    <button onclick="switchView('home')" class="w-full py-5 bg-white text-black font-black text-[10px] uppercase rounded-2xl tracking-widest">Update Environment</button>
                </div>
            </div>
        </div>

    </div>

    <!-- COMMAND TRIGGER (FAB) -->
    <div class="fab-container">
        <div class="fab-trigger" id="fabTrigger" onclick="toggleMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
    </div>

    <!-- MENU OVERLAY -->
    <div class="menu-overlay" id="menuOverlay">
        <div onclick="switchView('home')" class="menu-item">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Dashboard</span>
        </div>
        <div onclick="switchView('shell')" class="menu-item">
            <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span>Terminal</span>
        </div>
        <div onclick="switchView('config')" class="menu-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
        </div>
        <div onclick="startDeploy()" class="menu-item bg-[#00f2ff] text-black border-none">
            <svg viewBox="0 0 24 24" stroke="#000"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            <span style="font-weight: 900;">Deploy Now</span>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const fab = document.getElementById('fabTrigger');
            const overlay = document.getElementById('menuOverlay');
            fab.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            if(document.getElementById('menuOverlay').classList.contains('active')) toggleMenu();
        }

        setInterval(() => {
            document.getElementById('cpu-val').innerText = (Math.random() * 3 + 2).toFixed(1) + "%";
            document.getElementById('ram-val').innerText = (Math.floor(Math.random() * 5) + 126) + "MB";
        }, 2500);

        function startDeploy() {
            const key = document.getElementById('apiKey').value;
            if(!key) { alert("ERR: MASTER_KEY_NOT_SET"); switchView('config'); return; }
            toggleMenu();
            const btn = document.getElementById('fabTrigger');
            btn.style.background = "#fff";
            btn.innerHTML = '<div class="w-6 h-6 border-2 border-black border-t-transparent rounded-full animate-spin"></div>';
            setTimeout(() => {
                btn.style.background = "#22c55e";
                btn.innerHTML = '<svg viewBox="0 0 24 24" stroke="#000"><polyline points="20 6 9 17 4 12"/></svg>';
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
                }, 2000);
            }, 3000);
        }

        document.getElementById('shell-in').onkeydown = function(e) {
            if(e.key === 'Enter') {
                const out = document.getElementById('term-out');
                out.innerHTML += `<p><span class="text-[#00f2ff] font-bold">❯</span> ${this.value}</p>`;
                this.value = '';
                out.scrollTop = out.scrollHeight;
            }
        };
    </script>
</body>
</html>
