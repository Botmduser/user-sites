<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLADE | Pro Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');

        :root {
            --neon: #00f2ff;
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1a1a1a;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Essential Mobile Fit */
        .safe-area-top { pt: env(safe-area-inset-top); }
        .safe-area-bottom { pb: env(safe-area-inset-bottom); }

        .view-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        .view.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Solid UI Elements */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }

        .btn-prime {
            background: var(--neon);
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 12px;
            transition: 0.2s active;
        }

        .btn-prime:active { transform: scale(0.96); opacity: 0.8; }

        .nav-bar {
            background: rgba(5,5,5,0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            height: 85px;
            display: flex;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #444;
            transition: 0.3s;
        }

        .nav-item.active { color: var(--neon); }

        #code-editor {
            font-family: 'JetBrains Mono', monospace;
            background: transparent;
            color: #888;
            border: none;
            resize: none;
            width: 100%;
            height: 100%;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Super Sharp SVG Icons */
        svg { width: 22px; height: 22px; stroke-width: 2.5; fill: none; stroke: currentColor; }
    </style>
</head>
<body class="safe-area-top">

    <!-- HEADER -->
    <header class="h-16 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-2">
            <svg viewBox="0 0 24 24" class="text-[#00f2ff]"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor" stroke="none"/></svg>
            <span class="font-black text-xl tracking-tighter uppercase">Blade<span class="text-[#444]">Core</span></span>
        </div>
        <div class="px-3 py-1 border border-green-500/30 rounded-full">
            <span class="text-[10px] font-bold text-green-500 uppercase tracking-widest">Live</span>
        </div>
    </header>

    <!-- VIEWS -->
    <div class="view-container">
        
        <!-- DASHBOARD -->
        <div id="view-home" class="view active">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="card">
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Compute</p>
                    <p id="cpu-val" class="text-xl font-bold">4.2%</p>
                </div>
                <div class="card">
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Volatile</p>
                    <p id="ram-val" class="text-xl font-bold text-[#00f2ff]">128MB</p>
                </div>
            </div>
            
            <div class="card flex-1 flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Source: worker.js</span>
                    <button class="text-[10px] font-bold text-[#00f2ff]">SAVE</button>
                </div>
                <textarea id="code-editor" spellcheck="false">const blade = require('core');

// Instance Initializing...
blade.on('start', () => {
    console.log('Engine Active');
});</textarea>
            </div>
        </div>

        <!-- TERMINAL -->
        <div id="view-shell" class="view">
            <div class="card flex-1 bg-black overflow-hidden flex flex-col">
                <div id="terminal-out" class="flex-1 p-2 font-mono text-[12px] overflow-y-auto space-y-1 text-gray-400">
                    <p class="text-[#00f2ff]">BladeShell v1.0.0</p>
                    <p>Connecting to Node-01...</p>
                </div>
                <div class="flex items-center gap-2 border-t border-white/5 p-3">
                    <span class="text-[#00f2ff] font-bold">></span>
                    <input type="text" id="shell-input" class="bg-transparent outline-none flex-1 text-sm" placeholder="Command...">
                </div>
            </div>
        </div>

        <!-- CONFIG -->
        <div id="view-config" class="view">
            <div class="card space-y-6">
                <h2 class="text-lg font-black uppercase">Environment</h2>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-gray-500 uppercase">Deployment Secret</label>
                    <input type="password" id="secretKey" class="w-full bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-[#00f2ff] transition" placeholder="Key ID">
                </div>
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-xl">
                    <span class="text-xs font-bold">Auto-Scaling</span>
                    <div class="w-10 h-5 bg-[#00f2ff] rounded-full relative"><div class="absolute right-1 top-1 w-3 h-3 bg-black rounded-full"></div></div>
                </div>
                <button onclick="switchV('home')" class="btn-prime w-full py-4 mt-4">Update Core</button>
            </div>
        </div>

    </div>

    <!-- MOBILE NAV -->
    <nav class="nav-bar">
        <div onclick="switchV('home')" class="nav-item active" id="nav-home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="text-[8px]">CORE</span>
        </div>
        <div onclick="switchV('shell')" class="nav-item" id="nav-shell">
            <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span class="text-[8px]">SHELL</span>
        </div>
        
        <div onclick="launch()" class="px-6 flex items-center">
            <div class="w-12 h-12 btn-prime flex items-center justify-center shadow-[0_0_20px_rgba(0,242,255,0.3)]">
                <svg viewBox="0 0 24 24" style="stroke: #000; width: 24px; height: 24px;"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </div>
        </div>

        <div onclick="switchV('config')" class="nav-item" id="nav-config">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="text-[8px]">CONFIG</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span class="text-[8px]">SAFE</span>
        </div>
    </nav>

    <!-- OVERLAY -->
    <div id="launch-overlay" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center p-10 hidden">
        <div id="loader" class="w-16 h-16 border-4 border-[#00f2ff] border-t-transparent rounded-full animate-spin mb-6"></div>
        <h2 class="font-black text-xl italic mb-2 tracking-widest">PUSHING CORE</h2>
        <p id="l-stat" class="text-[10px] text-gray-500 font-mono uppercase tracking-[4px]">Synchronizing...</p>
    </div>

    <script>
        // SMART SWITCHER
        function switchV(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        // STATS SIM
        setInterval(() => {
            document.getElementById('cpu-val').innerText = (Math.random() * 5 + 1).toFixed(1) + "%";
            document.getElementById('ram-val').innerText = (Math.floor(Math.random() * 10) + 124) + "MB";
        }, 2000);

        // LAUNCH SEQUENCE
        function launch() {
            const secret = document.getElementById('secretKey').value;
            if(!secret) {
                alert("ERR: SECRET_KEY_MISSING");
                switchV('config');
                return;
            }

            const ov = document.getElementById('launch-overlay');
            const st = document.getElementById('l-stat');
            ov.classList.remove('hidden');

            let steps = ["Encapsulating", "Routing Edge", "Finalizing"];
            let i = 0;
            const t = setInterval(() => {
                st.innerText = steps[i];
                i++;
                if(i > 2) {
                    clearInterval(t);
                    st.innerText = "LIVE ON CLOUD";
                    st.style.color = "#00f2ff";
                    setTimeout(() => ov.classList.add('hidden'), 1500);
                }
            }, 1000);
        }

        // SHELL LOGIC
        document.getElementById('shell-input').onkeydown = function(e) {
            if(e.key === 'Enter') {
                const out = document.getElementById('terminal-out');
                out.innerHTML += `<p><span class="text-[#00f2ff]">></span> ${this.value}</p>`;
                if(this.value === 'status') out.innerHTML += `<p class="text-green-500">Node-01: Optimal</p>`;
                this.value = '';
                out.scrollTop = out.scrollHeight;
            }
        };
    </script>
</body>
</html>
