<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLADE PRO | Debug Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --neon: #00f2ff; --bg: #000000; --card: #0a0a0a; --border: #1a1a1a; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #ffffff; height: 100vh; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
        
        .stat-card { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 12px; }
        .view-container { flex: 1; padding: 0 16px; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Console/Log Styling */
        #log-container {
            font-family: 'JetBrains Mono', monospace;
            background: #050505;
            border: 1px solid #111;
            border-radius: 12px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-size: 10px;
            margin-top: 10px;
        }
        .log-entry { margin-bottom: 4px; border-left: 2px solid #333; padding-left: 8px; }
        .log-success { color: #22c55e; border-color: #22c55e; }
        .log-error { color: #ef4444; border-color: #ef4444; }
        .log-info { color: #00f2ff; border-color: #00f2ff; }

        #editor { font-family: 'JetBrains Mono', monospace; background: transparent; color: #aaa; border: none; resize: none; width: 100%; height: 100%; font-size: 12px; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: grid;
            grid-template-columns: repeat(4, 1fr); padding: 10px 5px calc(10px + env(safe-area-inset-bottom)) 5px;
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #444; }
        .nav-item.active { color: var(--neon); }
        .nav-item svg { width: 20px; height: 20px; }
        .nav-item span { font-size: 9px; font-weight: 800; text-transform: uppercase; }

        .sub-view { position: fixed; inset: 0; background: var(--bg); z-index: 50; padding: 20px; padding-top: 80px; display: none; }
        .sub-view.active { display: block; }
    </style>
</head>
<body>

    <header class="h-14 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-1.5 h-5 bg-[#00f2ff] rounded-full"></div>
            <span class="font-black text-lg tracking-tighter italic uppercase">Blade<span class="text-gray-700">S</span></span>
        </div>
        <div id="status-tag" class="bg-yellow-500/10 px-2 py-0.5 rounded border border-yellow-500/20">
            <span class="text-[8px] font-black text-yellow-500 uppercase">Idle</span>
        </div>
    </header>

    <div class="view-container">
        <!-- Stats -->
        <div class="grid grid-cols-2 gap-2 mb-3">
            <div class="stat-card"><p class="text-[7px] text-gray-600 uppercase font-bold">CPU</p><p id="cpu" class="text-sm font-bold text-white">0%</p></div>
            <div class="stat-card"><p class="text-[7px] text-gray-600 uppercase font-bold">RAM</p><p id="ram" class="text-sm font-bold text-[#00f2ff]">0MB</p></div>
        </div>

        <!-- Editor -->
        <div class="stat-card flex-1 flex flex-col overflow-hidden mb-[180px]">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[8px] font-bold text-gray-500 uppercase tracking-widest">Main.js</span>
                <button onclick="runDeploy()" class="bg-[#00f2ff] text-black text-[9px] font-black px-3 py-1 rounded">START HOST</button>
            </div>
            <textarea id="editor" spellcheck="false">const bot = require('blade-core');

bot.init({
    server: 'auto',
    logs: true
});</textarea>
        </div>

        <!-- LIVE LOGS (කෙලින්ම පේන ලොග්ස් ටික) -->
        <div id="log-container" class="fixed bottom-[75px] left-4 right-4 z-40">
            <div class="log-entry log-info">System initialized. Waiting for deploy...</div>
        </div>
    </div>

    <!-- Hidden Sub Views -->
    <div id="view-shell" class="sub-view">
        <h2 class="text-xl font-black mb-4 uppercase">Shell Terminal</h2>
        <div class="bg-black p-4 rounded-xl border border-white/5 font-mono text-[10px] text-gray-400 h-40">
            $ blade status --check<br>
            > Scanning ports...
        </div>
    </div>
    <div id="view-security" class="sub-view"><h2 class="text-xl font-black mb-4 uppercase">Security</h2><p class="text-xs text-gray-500">Firewall is running in background.</p></div>
    <div id="view-config" class="sub-view"><h2 class="text-xl font-black mb-4 uppercase">Settings</h2><p class="text-xs text-gray-500">No configurations found.</p></div>

    <!-- Nav -->
    <nav class="bottom-nav">
        <div onclick="showTab('main', this)" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Core</span></div>
        <div onclick="showTab('shell', this)" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg><span>Logs</span></div>
        <div onclick="showTab('security', this)" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Safe</span></div>
        <div onclick="showTab('config', this)" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Conf</span></div>
    </nav>

    <script>
        function addLog(msg, type='info') {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function runDeploy() {
            addLog("Starting build process...", "info");
            document.getElementById('status-tag').innerHTML = '<span class="text-[8px] font-black text-blue-500 uppercase animate-pulse">Building</span>';
            
            setTimeout(() => {
                const success = Math.random() > 0.2; // 80% chance for demo
                if(success) {
                    addLog("Build successful! Compiling assets...", "success");
                    addLog("Deployment live at: https://blade-stealth.app", "success");
                    document.getElementById('status-tag').innerHTML = '<span class="text-[8px] font-black text-green-500 uppercase">Live</span>';
                    document.getElementById('cpu').innerText = "1.8%";
                    document.getElementById('ram').innerText = "128MB";
                } else {
                    addLog("Error: Port 3000 is already in use.", "error");
                    addLog("Deployment failed. Check script configuration.", "error");
                    document.getElementById('status-tag').innerHTML = '<span class="text-[8px] font-black text-red-500 uppercase">Failed</span>';
                }
            }, 2000);
        }

        function showTab(id, el) {
            document.querySelectorAll('.sub-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(id !== 'main') document.getElementById('view-' + id).classList.add('active');
        }
    </script>
</body>
</html>
